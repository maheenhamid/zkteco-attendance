server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: attendance
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zkteco_attendance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-min-256-bits-long-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  device:
    offline-threshold-seconds: ${DEVICE_OFFLINE_THRESHOLD_SECONDS:180}
    command-timeout-seconds: ${DEVICE_COMMAND_TIMEOUT_SECONDS:600}
  institute-api:
    base-url: ${INSTITUTE_API_BASE_URL:http://localhost:8082/public}
    cache-ttl-seconds: ${INSTITUTE_API_CACHE_TTL_SECONDS:300}

logging:
  file:
    name: logs/attendance.log
  level:
    root: INFO
    com.zkteco.attendance: DEBUG
