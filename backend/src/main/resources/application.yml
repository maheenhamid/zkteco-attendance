server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: attendance

  # ==========================
  # Primary Database (DB1)
  # ==========================
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:zkteco_attendance}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ==========================
  # Secondary Database (DB2)
  # ==========================
  second-datasource:
    # NOTE: must be jdbc-url, not url - this binds directly onto a raw HikariDataSource
    # (via DataSourceBuilder + @ConfigurationProperties in SecondaryDataSourceConfig),
    # which only understands its own "jdbcUrl" property. The "url" -> "jdbcUrl"
    # translation only happens for Spring Boot's own spring.datasource.* (primary DB).
    jdbc-url: jdbc:mysql://${DB2_HOST:localhost}:${DB2_PORT:3306}/${DB2_NAME:sheba_client_attn_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Dhaka&createDatabaseIfNotExist=true
    username: ${DB2_USERNAME:root}
    password: ${DB2_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
    show-sql: false
  # ==========================
  # Flyway (Only DB1)
  # ==========================
  flyway:
    enabled: true
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Dhaka
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-min-256-bits-long-please}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://attendance.shebacms.com,http://localhost:5173}
  device:
    offline-threshold-seconds: ${DEVICE_OFFLINE_THRESHOLD_SECONDS:180}
    command-timeout-seconds: ${DEVICE_COMMAND_TIMEOUT_SECONDS:600}
  # Used only by InstituteApiService for the super-admin dashboard's
  # institute count - the frontend calls this same public API directly now.
  institute-api:
    base-url: ${INSTITUTE_API_BASE_URL:https://api.shebashikkha.com/public}
    cache-ttl-seconds: ${INSTITUTE_API_CACHE_TTL_SECONDS:300}

logging:
  file:
    name: logs/attendance.log
  level:
    root: INFO
    com.zkteco.attendance: DEBUG
    
